set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"          # truecolor for neovim
set -as terminal-features 'xterm*:extkeys'
set -g focus-events on                      # lets nvim autoread / FocusGained work
set -s extended-keys on                     # better modifier passthrough (Shift/Ctrl combos)
set -g history-limit 50000
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
setw -g mode-keys vi
set -g set-clipboard on

# ==========================================
bind-key v split-window -h
bind-key s split-window -v

# Ctrl-hjkl are reserved for nvim split navigation, so tmux must not grab them.
# Unbind explicitly: reloading this file (prefix r) never removes bindings an older config added.
unbind -n C-h
unbind -n C-j
unbind -n C-k
unbind -n C-l

# Use Option-vim keys without prefix key to switch panes
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R
 
# Use Option-vim keys without prefix key to switch panes in copy mode
bind -T copy-mode-vi M-h select-pane -L
bind -T copy-mode-vi M-j select-pane -D
bind -T copy-mode-vi M-k select-pane -U
bind -T copy-mode-vi M-l select-pane -R

# ── Pane resizing: Shift-arrows (no prefix) ───────────────────────────
bind -n S-Left  resize-pane -L 5
bind -n S-Right resize-pane -R 5
bind -n S-Up    resize-pane -U 3
bind -n S-Down  resize-pane -D 3

# ── Copy mode (vi) → macOS clipboard ─────────────────────────────────
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "pbcopy"

# ── No-prefix shortcuts that pass through to (n)vim ──────────────────
# When the pane is running vim/nvim (also under a parent like `git commit`),
# C-v / C-x / C-q / C-z go to the editor; otherwise they do the tmux action.
# Regex avoids \S: macOS (BSD) grep doesn't handle it reliably.
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -qE '^[^TXZ ]+ +(.*/)?g?(view|n?vim?x?)(diff)?$'"

# Ctrl-Z to zoom pane (nvim: suspend)
bind -n C-z if-shell "$is_vim" "send-keys C-z" "resize-pane -Z"

# Split windows without prefix key (C-v in nvim: visual block)
bind -n C-v if-shell "$is_vim" "send-keys C-v" "split-window -h"
bind -n C-s split-window -v
# Kill pane, no confirmation (C-x in nvim: decrement / insert-mode completion)
bind -n C-x if-shell "$is_vim" "send-keys C-x" "kill-pane"

# Clear history and scroll (C-q in nvim: visual block)
bind -n C-q if-shell "$is_vim" "send-keys C-q" { send-keys C-l ; send-keys -R ; clear-history }

# No delay for escape key press
set -sg escape-time 0

# Reload tmux config
bind r source-file ~/.config/tmux/tmux.conf
